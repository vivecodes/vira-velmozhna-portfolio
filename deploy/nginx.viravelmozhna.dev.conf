# Example nginx site for https://viravelmozhna.dev
# 1. Build locally:  npm run build
# 2. Upload contents of dist/ to the root below (e.g. /var/www/viravelmozhna.dev)
# 3. Enable this site and reload nginx
# 4. Issue TLS with certbot (see comments at bottom)

server {
    listen 80;
    listen [::]:80;
    server_name viravelmozhna.dev www.viravelmozhna.dev;

    # After certbot, this block usually only redirects to HTTPS.
    # Keep it until certbot rewrites the file, or redirect yourself:
    # return 301 https://viravelmozhna.dev$request_uri;

    root /var/www/viravelmozhna.dev;
    index index.html;

    # German locale (and its 404)
    location /de/ {
        try_files $uri $uri/index.html $uri.html /de/404/index.html;
    }

    # English + shared assets (PDFs, favicon, _astro/)
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # Cache fingerprinted Astro assets aggressively
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # CV PDFs: download-friendly, short cache
    location ~* \.pdf$ {
        add_header Content-Disposition "inline";
        expires 7d;
        try_files $uri =404;
    }

    # Security / basics
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Optional: force no directory listing
    autoindex off;
}

# After: sudo certbot --nginx -d viravelmozhna.dev -d www.viravelmozhna.dev
# certbot will add a listen 443 ssl server block (or merge into this file).
